<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research - Antonio Alcántara Mata</title>
    <!-- The Research page was split in November 2026: interests went to About,
         publications and software to publications.html, talks to talks.html.
         This file stays behind as a redirect because external links, search
         results and the old publications.html redirect point here. The script
         sends each old section anchor to its new home; without JavaScript the
         meta refresh lands on the publications. Not built by build.py. -->
    <link rel="canonical" href="https://www.antonioalcantara.com/publications.html">
    <meta name="robots" content="noindex, follow">
    <script>
        (function () {
            var to = {
                '#interests': 'about.html#interests',
                '#software': 'publications.html#software',
                '#dissemination': 'talks.html'
            };
            location.replace(to[location.hash] || 'publications.html');
        })();
    </script>
    <meta http-equiv="refresh" content="0; url=publications.html">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="page-header">
        <div class="container">
            <div class="page-header-content page-header-content-solo">
                <div class="page-header-text">
                    <h1 class="page-title">The Research page has moved</h1>
                    <p class="page-subtitle">
                        See <a href="publications.html" class="inline-link">Publications</a>,
                        <a href="talks.html" class="inline-link">Talks</a> or
                        <a href="about.html#interests" class="inline-link">research interests</a>.
                        You should be redirected automatically.
                    </p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
